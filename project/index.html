<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>House Price Predictor</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body class="bg-light">
    <div class="container py-5">
      <!-- Main Card -->
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="card shadow border-0 rounded-4">
            <!-- Card Header -->
            <div class="card-body p-4 p-md-5">
              <!-- Heading -->
              <div class="text-center mb-4">
                <h1 class="fw-bold">House Price Predictor</h1>
                <p class="text-muted">
                  Estimate house prices across the Kathmandu Valley
                </p>
              </div>

              <!-- Input -->
              <div class="mb-4">
                <label for="landSize" class="form-label fw-semibold">
                  Land Size
                </label>

                <div class="input-group">
                  <input
                    type="number"
                    class="form-control form-control-lg"
                    id="size"
                    placeholder="e.g. 6.5"
                    step="0.1"
                    min="0"
                  />

                  <span class="input-group-text"> Aana </span>
                </div>
              </div>

              <!-- Button -->
              <div class="d-grid mb-4">
                <button class="btn btn-primary btn-lg" onclick="predict()">
                  Predict Price
                </button>
              </div>

              <!-- Result -->
              <div class="bg-light border rounded-4 p-4 text-center">
                <h5 class="text-muted mb-2">Estimated Price</h5>

                <h2 class="fw-bold text-success mb-0" id="result"></h2>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrVhcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script>
      function predict() {
        // Get land size
        const size = parseFloat(document.getElementById("size").value);
        // Check empty input
        if (isNaN(size) || size <= 0) {
          alert("Please enter a valid land size.");
          return;
        }
        // Prediction formula
        const price = 1.52173913 * size + 0.05797101;
        // Show result
        document.getElementById("result").innerText =
          "NRP " + price.toFixed(2) + "cr.";
      }
    </script>
  </body>
</html>
